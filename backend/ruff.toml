# Explicit rule set so CI results don't change with new ruff releases.
target-version = "py310"
line-length = 110
src = ["."]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC", "UP", "RUF100"]
ignore = [
  "B008",  # FastAPI's File(...)/Depends(...) in defaults is the intended idiom
]

[lint.isort]
known-first-party = ["app", "tests"]
