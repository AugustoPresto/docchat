# Render Blueprint — the whole public demo (frontend + API) as ONE free web service.
# Render dashboard → New → Blueprint → pick this repo, then fill in GROQ_API_KEY.
#
# Free plan: 512 MB RAM, 0.1 CPU, sleeps after 15 min idle (~1 min to wake up),
# no persistent disk — documents live until the next restart (and at most
# DOC_TTL_HOURS). Each visitor only sees their own documents (ISOLATE_CLIENTS).
services:
  - type: web
    name: docchat
    runtime: docker
    plan: free
    region: virginia
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: GROQ_API_KEY
        sync: false            # asked for when the Blueprint is created
      # 0.1 CPU: one embedding thread is ~4x faster than one per host core.
      - key: EMBED_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: ISOLATE_CLIENTS
        value: "true"
      - key: DOC_TTL_HOURS
        value: "24"
      - key: MAX_DOCS_PER_CLIENT
        value: "5"
      - key: MAX_UPLOAD_MB
        value: "20"
