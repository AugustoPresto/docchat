# Full offline stack: Ollama (LLM) + FastAPI backend + React frontend.
# First run needs internet to pull images and the model; afterwards it runs offline.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: docchat-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Enable GPU if available (uncomment if you have an NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build: ./backend
    container_name: docchat-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CHAT_MODEL=llama3.2:3b
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/vector_stores:/app/vector_stores
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: docchat-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
